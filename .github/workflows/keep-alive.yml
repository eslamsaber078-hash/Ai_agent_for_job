# Render's free plan stops a web service after 15 minutes without traffic, and the
# next visitor then waits out a full cold boot — the page itself is served by that
# same stopped process, so nothing on the client can fix it. A request well inside
# the window keeps the process running, and the site opens instantly.
#
# One-time setup: GitHub → Settings → Secrets and variables → Actions → Variables →
# New repository variable, name SITE_URL, value the service URL from the Render
# dashboard (e.g. https://something.onrender.com, no trailing slash). Until it is
# set the job exits quietly.
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the service
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL repository variable is not set — nothing to ping."
            exit 0
          fi
          # A sleeping service answers slowly on purpose; --retry rides that out
          # instead of reporting the wake-up itself as a failure.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
                 --retry 2 --retry-delay 10 --retry-all-errors \
                 "$SITE_URL/api/health" || true)
          echo "health -> $code"
          test "$code" = "200"

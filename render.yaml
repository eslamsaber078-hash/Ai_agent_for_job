# Render blueprint: one web service runs backend + built frontend on the same
# domain. Deploy via Dashboard → New → Blueprint (or sync this repo) and fill
# the env values marked sync:false in the service settings afterwards.

services:
  - type: web
    name: ai-job-hunter
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      npm install --prefix ../frontend
      npm run build --prefix ../frontend
    # --proxy-headers/--forwarded-allow-ips: Render's proxy terminates HTTPS, so the
    # app has to read the scheme from the headers or it treats every visitor as
    # plain HTTP and refuses to set the secure session cookie.
    # --timeout-keep-alive: uvicorn closes an idle connection after 5s by default.
    # The proxy pools sockets for longer, so the next request could be sent down a
    # connection this process had already closed — seen from the browser as a
    # dropped connection. 75s keeps both ends agreeing.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --timeout-keep-alive 75
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Paste the Postgres connection string from Neon (Free, no card). Do NOT
      # keep the local sqlite default: Render's disk is wiped on every deploy.
      - key: DATABASE_URL
        sync: false
      # Public HTTPS site: the session cookie must only travel over HTTPS.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
